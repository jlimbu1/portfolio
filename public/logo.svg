<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LJ logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#825991"/>
      <stop offset="1" stop-color="#5a3b63"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile (brand primary -> primary dark) -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- Interlocked LJ monogram (Didot, thin, LV-style). L and J share the same
       vertical axis; the J sits slightly lower than the L. -->
  <g font-family="Didot, 'Bodoni 72', 'Bodoni MT', Bodoni, 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="320" font-weight="400" fill="#FFFFFF">
    <text x="212" y="378" text-anchor="middle">L</text>
    <text x="318" y="402" text-anchor="middle">J</text>
  </g>
</svg>
